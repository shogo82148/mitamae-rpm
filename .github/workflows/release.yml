name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-slim
    steps:
      - name: Create GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --generate-notes

  build:
    needs: prepare
    runs-on: ${{ case(matrix.platform == 'x86_64', 'ubuntu-24.04', 'ubuntu-24.04-arm') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: |
          make ${{ matrix.platform }}

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: test
        run: |
          make test-${{ matrix.platform }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::445285296882:role/rpm-repository-users-MitamaeRole-1OPFWBU8880WC
      - name: upload to S3
        run: |
          make upload
      - name: upload to GitHub Release
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.platform }}.build/RPMS/${{ matrix.platform }}/*.${{ matrix.platform }}.rpm" --repo "${GITHUB_REPOSITORY}" --clobber

  release:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft=false
