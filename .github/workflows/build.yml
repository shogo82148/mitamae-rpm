name: build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ case(matrix.platform == 'x86_64', 'ubuntu-26.04', 'ubuntu-26.04-arm') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: |
          make ${{ matrix.platform }}

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: test
        run: |
          make test-${{ matrix.platform }}
